name: Build and Deploy Functions to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'apps/functions/**'
  workflow_dispatch:

env:
  FUNCTIONAPP_NAME: ${{ secrets.FUNCTIONAPP_NAME }}
  NODE_VERSION: '22.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm install

      - name: Build TypeScript code
        run: npm run build -w apps/functions
        
      - name: Prepare isolated ZIP package
        run: |
          # Create staging directory OUTSIDE the workspace to completely prevent npm from hoisting dependencies to the root
          mkdir -p /tmp/staging
          
          # Copy only the necessary production files
          cp -r apps/functions/dist /tmp/staging/
          cp apps/functions/package.json /tmp/staging/
          cp apps/functions/host.json /tmp/staging/
          
          # Install production dependencies directly inside the isolated folder
          cd /tmp/staging
          npm install --omit=dev
          
          # Zip the contents and save it back into the GitHub workspace
          zip -r $GITHUB_WORKSPACE/functionapp.zip .
          
      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTIONAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          package: ./functionapp.zip
